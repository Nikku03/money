[project]
name = "money-brain"
version = "0.1.0"
description = "Memory bank and evidence engine for public market data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
analyst = ["anthropic>=1.13"]
alt = ["opencv-python-headless>=4.8", "websockets>=13"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
include = ["brain*"]
