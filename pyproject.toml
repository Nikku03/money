[project]
name = "money-brain"
version = "0.1.0"
description = "Memory bank and evidence engine for public market data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
alt = ["opencv-python-headless>=4.8", "websockets>=13"]
lm = ["torch>=2.2", "transformers>=4.56"]   # brain neuro lm-*: look inside a Pythia language model

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.ruff]
extend-exclude = ["brain/chain/engine"]   # copied unchanged from Nikku03/cell (PROVENANCE.md)
